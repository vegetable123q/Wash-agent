name: Release APK

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python environment
        run: uv sync

      - name: Run Python tests
        run: uv run python -m unittest discover -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build web assets and sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" ] && [ -n "$ANDROID_KEY_ALIAS_SECRET" ] && [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/release.keystore
            {
              echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/frontend/android/app/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are not fully configured; generating a CI-only release keystore. Configure repository secrets for stable release signing."
            temporary_password="$(openssl rand -hex 24)"
            keytool -genkeypair \
              -storetype PKCS12 \
              -keystore frontend/android/app/ci-release.keystore \
              -storepass "$temporary_password" \
              -alias ci-release \
              -keypass "$temporary_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30 \
              -dname "CN=WashMate CI Release, OU=CI, O=WashMate, L=Beijing, S=Beijing, C=CN"
            {
              echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/frontend/android/app/ci-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$temporary_password"
              echo "ANDROID_KEY_ALIAS=ci-release"
              echo "ANDROID_KEY_PASSWORD=$temporary_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        working-directory: frontend/android
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: washmate-campus-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: WashMate Campus APK ${{ github.run_number }}
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
