name: Release APK

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python environment
        run: uv sync

      - name: Run Python tests
        run: uv run python -m unittest discover -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read release version
        id: release_version
        working-directory: frontend
        run: |
          tag_name="$(node -e "const version=require('./package.json').version; const match=version.match(/^(0\.\d+)(?:\.0)?$/); if (!match) { console.error('Release version must use 0.xx form, got ' + version); process.exit(1); } console.log(match[1]);")"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Update Android version from package.json
        working-directory: frontend
        run: |
          version="$(node -e "console.log(require('./package.json').version)")"
          version_code="$(echo "$version" | sed 's/^0\.\([0-9]*\).*/\1/')"
          version_name="$(echo "$version" | sed 's/\([0-9]*\.[0-9]*\)\.[0-9]*/\1/')"
          echo "Updating build.gradle: versionCode=$version_code, versionName=$version_name"
          sed -i "s/versionCode [0-9]*/versionCode $version_code/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$version_name\"/" android/app/build.gradle

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build web assets and sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" ] && [ -n "$ANDROID_KEY_ALIAS_SECRET" ] && [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/release.keystore
            {
              echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/frontend/android/app/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are not fully configured; generating a CI-only release keystore. Configure repository secrets for stable release signing."
            temporary_password="$(openssl rand -hex 24)"
            keytool -genkeypair \
              -storetype PKCS12 \
              -keystore frontend/android/app/ci-release.keystore \
              -storepass "$temporary_password" \
              -alias ci-release \
              -keypass "$temporary_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30 \
              -dname "CN=WashMate CI Release, OU=CI, O=WashMate, L=Beijing, S=Beijing, C=CN"
            {
              echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/frontend/android/app/ci-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$temporary_password"
              echo "ANDROID_KEY_ALIAS=ci-release"
              echo "ANDROID_KEY_PASSWORD=$temporary_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        working-directory: frontend/android
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: washmate-campus-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Update release tag
        run: |
          TAG_NAME="${{ steps.release_version.outputs.tag_name }}"
          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag_name }}
          name: WashMate Campus ${{ steps.release_version.outputs.tag_name }}
          body: |
            - APK 内置后端服务，不需要单独启动本地后端。
            - 识图使用用户输入的 ModelHub baseUrl/apikey，apikey 不持久化保存。
            - 模型选择限定为 gemini-3.1-pro-preview。
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
